<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050608"><link rel="icon" href="logo.png" type="image/png"><title>Gestión del catálogo · DEV3D Studio</title><link rel="stylesheet" href="brand-87f53ceba4.css"></head><body data-admin="true"><header><a class="brand" href="index.html" aria-label="DEV3D Studio, inicio"><img src="logo.png" width="70" height="70" style="width:70px;height:70px;object-fit:contain" alt=""><span class="brand-wordmark"><strong>DEV<span class="brand-blue">3</span>D</strong><small>STUDIO</small></span></a><nav><span id="identity"></span><button id="loginOpen">Iniciar sesión</button><button id="logout" hidden>Salir</button><a href="index.html">Ver catálogo</a></nav></header><main><h1>Gestión del catálogo</h1><p id="status" role="status">Verificando acceso…</p><section id="adminPanel" hidden><div class="admin-layout"><form id="productForm" class="panel"><h2 id="formTitle">Nuevo producto</h2><input name="id" type="hidden"><label>Nombre<input name="nombre" maxlength="150" required></label><label>Descripción<textarea name="descripcion" maxlength="3000"></textarea></label><label>Categoría<input name="categoria" maxlength="100"></label><label>Fotografía<input name="foto" type="file" accept="image/*"></label><label>O URL de imagen<input name="imagen" type="url" placeholder="https://?"></label><label>Precio público (€)<input name="precio" type="number" min="0" step="0.01" required></label><label>Precio mayorista por unidad (€)<input name="mayorista" type="number" min="0" step="0.01" required></label><label>Pedido mínimo (unidades)<input name="minimo" type="number" min="1" step="1" value="1" required></label><button id="saveProduct">Guardar producto</button><button id="resetProduct" type="button" class="secondary">Nuevo / cancelar edición</button></form><section><h2>Productos publicados</h2><div id="adminProducts"></div><form id="shopForm" class="panel"><h2>Autorizar una tienda</h2><p>Crea primero la cuenta en Firebase Authentication (correo y contraseña). Introduce aquí su UID para concederle o retirarle acceso mayorista.</p><label>UID de la cuenta<input name="uid" pattern="[A-Za-z0-9_-]+" required></label><label>Nombre de la tienda<input name="nombre" required></label><label>Estado<select name="activo"><option value="true">Autorizada</option><option value="false">Sin acceso mayorista</option></select></label><button>Guardar acceso</button></form><div id="shops"></div></section></div></section></main>
<dialog id="loginDialog"><form id="loginForm"><h2>Acceso de administración</h2><label>Correo<input name="email" type="email" autocomplete="username" required></label><label>Contraseña<input name="password" type="password" autocomplete="current-password" required></label><p id="loginError" role="alert"></p><button>Entrar</button><button id="loginClose" type="button" class="secondary">Cancelar</button></form></dialog><script src="firebase-config.js"></script><script src="firebase-loader.js"></script><script src="catalogo-app.js"></script></body></html>
